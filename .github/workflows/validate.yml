name: Validate HAL Eye Theme

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Build reproducible install ZIP
        run: python scripts/build_release.py
      - name: Validate manifest and custom expression textures
        run: python scripts/validate_release.py
