name: Bootstrap HAL v1.0.1 and publish stable release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: hashFiles('.bootstrap/part-*.bin') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Restore complete theme source and preserve selected LICENSE
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.bin > /tmp/hal-source.zip
          echo '03d88d39b227d86eaf6b5be8f07089d33eb361bcd447b753fa1cc6fa09f6d7cf  /tmp/hal-source.zip' | sha256sum --check
          mkdir -p /tmp/hal-extracted
          unzip -q /tmp/hal-source.zip -d /tmp/hal-extracted
          test -f /tmp/hal-extracted/jibo-hal-eye-theme/manifest.json
          cp -a /tmp/hal-extracted/jibo-hal-eye-theme/. .
          # GitHub Actions GITHUB_TOKEN cannot push new workflow definitions.
          # Restore ordinary source/assets first; add CI/release YAML through
          # the authenticated GitHub connector after this bootstrap succeeds.
          find .github/workflows -maxdepth 1 -type f ! -name 'bootstrap-hal.yml' -delete
          git restore --source=HEAD -- LICENSE
          rm -f Publish-HAL-Stable.ps1 Publish-HAL-Stable.cmd
          rm -rf .bootstrap
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          text=p.read_text()
          text=text.replace("Intended repository: `https://github.com/Matt87c/jibo-hal-eye-theme` (created by `Publish-HAL-Stable.ps1` when run with your own GitHub CLI).", "Public repository: `https://github.com/Matt87c/jibo-hal-eye-theme`.")
          p.write_text(text)
          Path('PUBLISHING.md').write_text("# HAL Red Eye v1.0.1\n\nPublic GitHub repository: https://github.com/Matt87c/jibo-hal-eye-theme.\n\nThe stable release has installable asset `jibo-hal-eye-theme.zip`. Static validation passed; v1.0.1 expression animations still require physical hardware retesting. See RELEASE_NOTES.md and docs/HARDWARE_TEST.md.\n")
          PY
      - name: Install Python image dependency
        run: python -m pip install Pillow==11.3.0
      - name: Build and verify release ZIP
        run: |
          python scripts/build_release.py
          python scripts/validate_release.py
          echo '569e91edbf543ad418551843afa86a96ef4d2a3553d9916cb82231cee506199e  dist/jibo-hal-eye-theme.zip' | sha256sum --check
      - name: Commit all source assets and remove temporary chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish HAL v1.0.1 artwork, source, validation, documentation'
          git push origin HEAD:main
      - name: Publish v1.0.1 stable release with install ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view v1.0.1 >/dev/null 2>&1; then
            gh release create v1.0.1 dist/jibo-hal-eye-theme.zip --target "$(git rev-parse HEAD)" --title 'HAL Red Eye v1.0.1' --notes-file RELEASE_NOTES.md --latest
          fi
          gh release view v1.0.1 --json isDraft,isPrerelease,assets,url
          test "$(gh release view v1.0.1 --json isDraft,isPrerelease --jq '(.isDraft == false and .isPrerelease == false)')" = true
          test "$(gh release view v1.0.1 --json assets --jq '[.assets[].name] | index("jibo-hal-eye-theme.zip") != null')" = true
